[package]
name = "jarvis-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
jarvis-voice = { path = "../../../crates/voice" }
tauri = { version = "2", features = [] }
jarvis-runtime = { path = "../../../crates/runtime" }

jarvis-identity = { path = "../../../crates/identity" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
