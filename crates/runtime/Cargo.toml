[package]
name = "jarvis-runtime"
version = "0.4.0"
edition = "2021"
rust-version = "1.91"
[dependencies]
jarvis-voice = { path = "../voice" }
jarvis-identity = { path = "../identity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
fs2 = "0.4"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
getrandom = "0.4"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSRunLoop", "NSNotification", "NSOperation", "NSDate", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
block2 = "0.6"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Memory"] }
